[defaults]
inventory = inventory/azure_rm.yml
roles_path = roles
collections_path = .collections
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
forks = 10
# Per-user temp dir, so tasks that `become` an unprivileged user (postgres,
# sortie) get a directory they own instead of falling back with warnings.
remote_tmp = /tmp/.ansible-${USER}/tmp

[privilege_escalation]
become_method = sudo

[ssh_connection]
pipelining = True
# accept-new: trust a freshly built VM's host key on first contact, but refuse
# if it later changes (a re-imaged host or a man-in-the-middle).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
