# Prometheus + Alertmanager + Grafana sized for the small dev cluster.
# Container Insights (Azure Monitor) covers node/container logs; this stack
# covers application metrics, SLO alerting and dashboards (Phase 6).

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 8GB
    # Discover ServiceMonitors/PrometheusRules from every namespace, not only
    # ones carrying this release's labels, so app teams can self-onboard.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: managed-csi
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

grafana:
  # Password lives in a Secret created by install-addons.sh, never in values.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: utc
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL  # app teams ship dashboards as labelled ConfigMaps
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# AKS manages these control-plane components; they are not scrapeable.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
