# Throwaway PostgreSQL for the local kind cluster only (Azure uses the managed
# Flexible Server). Lives outside the app namespace, which enforces the
# `restricted` Pod Security profile that the postgres image does not meet.
#
# A StatefulSet with a persistent volume, so a restart keeps the data, like
# the managed service. (An emptyDir here once turned a chaos drill's database
# restart into silent data loss.)
apiVersion: v1
kind: Namespace
metadata:
  name: local-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: local-db
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: sortie_tracker
            - name: POSTGRES_USER
              value: sortie
            - name: POSTGRES_PASSWORD
              value: local-dev-only
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sortie", "-d", "sortie_tracker"]
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: local-db
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
