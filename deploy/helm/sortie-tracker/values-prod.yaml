app:
  environment: prod
  logLevel: INFO

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

autoscaling:
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 60

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  postgresCidr: 10.20.8.0/24  # infra/live/prod/env.hcl vnet 10.20.0.0/16 -> snet-db
