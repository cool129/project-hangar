{{- if .Values.networkPolicy.enabled }}
# Zero-trust for the namespace: deny everything, then allow only
#   in:  gateway + Prometheus -> app port
#   out: cluster DNS, PostgreSQL subnet
# Key Vault access happens in the node-level CSI driver, not from the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sortie-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sortie-tracker.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sortie-tracker.selectorLabels" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: http
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: {{ required "networkPolicy.postgresCidr is required when networkPolicy is enabled" .Values.networkPolicy.postgresCidr }}
      ports:
        - port: 5432
          protocol: TCP
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
