{{- if eq .Values.secrets.provider "keyvault" }}
# Mounts Key Vault secrets as files. The CSI driver authenticates as the pod's
# workload identity, so no credentials exist anywhere in the cluster.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "sortie-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sortie-tracker.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ required "workloadIdentity.clientId is required for the keyvault provider" .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "secrets.keyVaultName is required for the keyvault provider" .Values.secrets.keyVaultName | quote }}
    tenantId: {{ required "workloadIdentity.tenantId is required for the keyvault provider" .Values.workloadIdentity.tenantId | quote }}
    objects: |
      array:
      {{- range .Values.secrets.objects }}
        - |
          objectName: {{ . }}
          objectType: secret
      {{- end }}
{{- end }}
