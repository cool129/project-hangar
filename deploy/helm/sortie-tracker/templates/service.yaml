apiVersion: v1
kind: Service
metadata:
  name: {{ include "sortie-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sortie-tracker.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "sortie-tracker.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      appProtocol: http
