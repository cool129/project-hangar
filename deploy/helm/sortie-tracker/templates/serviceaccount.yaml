apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sortie-tracker.labels" . | nindent 4 }}
  annotations:
    {{- if .Values.workloadIdentity.clientId }}
    azure.workload.identity/client-id: {{ .Values.workloadIdentity.clientId | quote }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
# Pods get Azure tokens via workload identity, not the Kubernetes API token.
automountServiceAccountToken: false
