{{- if .Values.podDisruptionBudget.enabled }}
# Keeps the API serving through node upgrades (AKS node image auto-upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "sortie-tracker.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sortie-tracker.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "sortie-tracker.selectorLabels" . | nindent 6 }}
{{- end }}
