name: k8s

# Chart + platform manifests: static checks, then the full kind end-to-end
# test (PSS admission, migrations, gateway routing, NetworkPolicy) on every PR.

on:
  pull_request:
    paths:
      - "deploy/**"
      - "app/**"
      - "tests/prometheus/**"
      - ".github/workflows/k8s-ci.yml"
  push:
    branches: [main]
    paths:
      - "deploy/**"
      - ".github/workflows/k8s-ci.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CHART: deploy/helm/sortie-tracker

jobs:
  chart-lint:
    name: Lint, schema-validate and scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # read the repository
      security-events: write  # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install tools
        run: scripts/ci/install-tools.sh kubeconform

      - name: helm lint + render
        run: |
          sets=(--set image.repository=example.azurecr.io/sortie-tracker --set image.tag=ci
                --set secrets.keyVaultName=kv-example
                --set workloadIdentity.clientId=00000000-0000-0000-0000-000000000001
                --set workloadIdentity.tenantId=00000000-0000-0000-0000-000000000002)
          mkdir -p rendered
          for env in dev prod; do
            helm lint "$CHART" -f "$CHART/values-${env}.yaml" "${sets[@]}" --strict
            helm template sortie-tracker "$CHART" -n sortie-tracker -f "$CHART/values-${env}.yaml" "${sets[@]}" \
              > "rendered/${env}.yaml"
          done
          helm template sortie-tracker "$CHART" -n sortie-tracker -f deploy/local/values-local.yaml > rendered/local.yaml

      - name: kubeconform (core + CRD schemas)
        run: |
          kubeconform -strict -summary -kubernetes-version 1.34.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered/*.yaml deploy/platform/*.yaml deploy/local/postgres.yaml

      - name: Alert rules (promtool check + unit tests)
        run: |
          for cmd in "check rules ../../deploy/helm/sortie-tracker/files/prometheus-rules.yaml" \
                     "test rules rules-test.yaml"; do
            # shellcheck disable=SC2086  # word-split the promtool sub-command on purpose
            docker run --rm -v "$PWD:/w:ro" -w /w/tests/prometheus --entrypoint promtool \
              prom/prometheus:v3.5.0 $cmd
          done

      - name: Checkov (Kubernetes)
        run: |
          source scripts/ci/tool-versions.env
          pip install --quiet "checkov==${CHECKOV_VERSION}"
          checkov -d rendered --framework kubernetes --compact \
            --output cli --output sarif --output-file-path console,reports

      - name: Upload Checkov SARIF
        if: always() && hashFiles('reports/results_sarif.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: reports/results_sarif.sarif
          category: checkov-kubernetes

  kind-e2e:
    name: End-to-end on kind
    needs: chart-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read  # read the repository
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: v0.33.0
          cluster_name: hangar
          wait: 120s

      - name: Build app image
        run: docker build --build-arg GIT_SHA="${GITHUB_SHA::7}" -t sortie-tracker:local app

      - name: Run end-to-end test
        run: deploy/local/kind-e2e.sh

      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl -n sortie-tracker describe pods
          kubectl -n sortie-tracker logs -l app.kubernetes.io/name=sortie-tracker --all-containers --tail=100
          kubectl -n envoy-gateway-system get gateway,httproute -A -o yaml
          kubectl get events -A --sort-by=.lastTimestamp | tail -50
