[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sortie-tracker"
version = "0.1.0"
description = "Tracks aircraft mission-capable status and sortie lifecycles for Project HANGAR."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
sortie-tracker-seed = "sortie_tracker.seed:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sortie_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires PostgreSQL via TEST_DATABASE_URL"]

[tool.coverage.run]
source = ["sortie_tracker"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "BLE"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"migrations/**" = ["E501"]
